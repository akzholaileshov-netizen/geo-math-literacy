<!doctype html>
<html lang="kk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="ҰБТ / ЕНТ математикалық сауаттылыққа дайындық. Подготовка к математической грамотности."
    />
    <title>Математикалық сауаттылық · ҰБТ</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Source+Sans+3:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap"
      rel="stylesheet"
    />
    <script>
      try {
        var theme = localStorage.getItem('ubt-theme');
        if (theme !== 'light') document.documentElement.classList.add('dark');
        var lang = localStorage.getItem('ubt-lang');
        if (lang === 'ru') document.documentElement.lang = 'ru';
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
